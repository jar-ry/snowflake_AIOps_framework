environments:
  dev:
    database: RETAIL_AI_DEV
    schema: ANALYTICS
    semantic_schema: SEMANTIC
    warehouse: RETAIL_AI_EVAL_WH
    connection_name: default
    semantic_view: RETAIL_AI_DEV.SEMANTIC.RETAIL_ANALYTICS_SV
    agent_name: RETAIL_AI_DEV.SEMANTIC.RETAIL_AGENT
    semantic_view_short: RETAIL_ANALYTICS_SV
    agent_short: RETAIL_AGENT
    sv_yaml_path: semantic_views/dev/retail_analytics_sv.yaml
    agent_sql_path: agents/dev/retail_agent.sql

  prod:
    database: RETAIL_AI_PROD
    schema: ANALYTICS
    semantic_schema: SEMANTIC
    warehouse: RETAIL_AI_EVAL_WH
    connection_name: default
    semantic_view: RETAIL_AI_PROD.SEMANTIC.RETAIL_ANALYTICS_SV
    agent_name: RETAIL_AI_PROD.SEMANTIC.RETAIL_AGENT
    semantic_view_short: RETAIL_ANALYTICS_SV
    agent_short: RETAIL_AGENT
    sv_yaml_path: semantic_views/prod/retail_analytics_sv.yaml
    agent_sql_path: agents/prod/retail_agent.sql

eval:
  database: RETAIL_AI_EVAL
  schema: RESULTS
  monitoring_schema: MONITORING
  observability_schema: OBSERVABILITY
  warehouse: RETAIL_AI_EVAL_WH
  # Eval dataset table created in each env's semantic_schema (06_eval_dataset_setup.sql)
  dataset_table: RETAIL_AGENT_EVAL_DATASET

# RBAC role names (created by 04_rbac_setup.sql). Clients map these onto their own roles.
roles:
  analyst: RETAIL_AI_ANALYST
  reviewer: RETAIL_AI_REVIEWER
  deployer: RETAIL_AI_DEPLOYER
  admin: RETAIL_AI_ADMIN

# Question bank locations (relative to repo root).
question_banks:
  agent_dir: question_banks/agent
  semantic_view_dir: question_banks/semantic_view

llm:
  model: claude-opus-4-7
  judge_model: claude-opus-4-7
  analyst_model: default

