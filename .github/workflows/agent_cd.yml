name: Agent CD - Promote to PROD

on:
  push:
    branches: [main]
    paths:
      - 'examples/*/agents/**'

jobs:
  promote-agent-to-prod:
    runs-on: ubuntu-latest
    env:
      DEFAULT_INSTANCE: examples/retail
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve active instance from changed files
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="HEAD~1"; fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files:"; echo "$CHANGED"
          INSTANCES=$(echo "$CHANGED" | grep -oE '^examples/[^/]+/agents/' | sed -E 's#/agents/.*##' | sort -u)
          COUNT=$(printf '%s\n' "$INSTANCES" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            INSTANCE="${DEFAULT_INSTANCE}"
            echo "No example agent change detected; using DEFAULT_INSTANCE=$INSTANCE"
          else
            if [ "$COUNT" -gt 1 ]; then echo "WARNING: multiple instances changed; using the first:"; echo "$INSTANCES"; fi
            INSTANCE=$(printf '%s\n' "$INSTANCES" | head -1)
          fi
          echo "AIOPS_INSTANCE=$INSTANCE" >> "$GITHUB_ENV"
          echo "Resolved AIOPS_INSTANCE=$INSTANCE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run native Snowflake agent evaluation on DEV (GPA framework)
        run: |
          python evaluation/audit_agent.py \
            --environment dev \
            --metrics answer_correctness,logical_consistency,safety,groundedness,execution_efficiency \
            --git-sha ${{ github.sha }} \
            --git-branch main \
            --timeout 600 \
            --output agent_eval_results.json

      - name: Check evaluation passed
        run: |
          python -c "
          import json, sys
          with open('agent_eval_results.json') as f:
              results = json.load(f)
          if not results.get('passed_threshold'):
              avg = results.get('overall_average', 0)
              print(f'NATIVE EVAL FAILED: Overall avg {avg}')
              for metric, score in results.get('metric_averages', {}).items():
                  print(f'  {metric}: {score:.3f}')
              sys.exit(1)
          print(f'Native eval PASSED: Overall avg {results.get(\"overall_average\", 0):.3f}')
          "

      - name: Deploy agent to PROD
        run: python setup/deploy.py --target agent --environment prod

      - name: Upload results artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-prod-promotion-results
          path: agent_eval_results.json
