name: Docs Lint

# Lints the docs/ tree on any PR or push that touches documentation or the
# lint config. Scoped to docs/** so it gates the new, conventions-compliant
# documentation without failing on pre-existing root markdown (README, AGENT,
# demo/*) that predates this ruleset. Broaden the glob once those are migrated.

on:
  pull_request:
    paths:
      - "docs/**/*.md"
      - ".markdownlint.json"
      - ".github/workflows/docs-lint.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - ".markdownlint.json"

jobs:
  markdownlint:
    name: markdownlint (docs/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint docs/ markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "docs/**/*.md"
          config: ".markdownlint.json"
